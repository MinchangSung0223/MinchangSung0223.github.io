title: 연구/정리/코드
description: Just another documentation theme compatible with GitHub Pages

# ✅ just-the-docs 테마 사용
remote_theme: just-the-docs/just-the-docs
color_scheme: light  # 또는 dark, auto 등 설정 가능

# ✅ Plugins 설정 (GitHub Pages에서 remote_theme 작동시키기 위해 필요)
plugins:
  - jekyll-remote-theme
  - jemoji
  - jekyll-avatar
  - jekyll-mentions

# ✅ 기존 테마 관련 설정 제거
# theme: null  ← 제거
# readme_index 관련 설정도 제거 가능 (선택)

exclude:
  - Makefile
  - CNAME
  - LICENSE
  - update.sh
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
  - jekyll-rtd-theme.gemspec
